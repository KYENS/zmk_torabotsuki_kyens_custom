CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_GPIO_HOGS=y
CONFIG_INPUT_PINNACLE=y
# Don't put the pad into its own sleep mode when ZMK goes idle. ZMK only
# counts key presses as activity, so this switched the pad's sleep on after
# 30 s of trackpad-only use. The pad still powers down in deep sleep.
CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER=n
